# Release builds — native macOS arm64 app (openFrameworks 0.12.1).
#
# Fires on any v* tag push: builds bin/Starships.app with the exact recipe
# documented in BUILD-arm64.md, then attaches a zip to the GitHub Release.
#
# - Runner: `macos-15` = Apple Silicon (arm64), the arch this repo targets.
# - oF install path: `$(HOME)/lib/of_v0.12.1_osx_release` — exactly what
#   config.make sets as OF_ROOT (`$(HOME)/lib/...`, NOT under `/.local` —
#   the oF makefiles' hidden-dir filter excludes all core sources from any
#   `/.` path component; see BUILD-arm64.md), so no build config changes
#   are needed on CI. The cache holds the tarball-extracted tree INCLUDING
#   the compiled oF core library (it lives inside OF_ROOT), so after the
#   first run both the ~1 GB download and the core build are skipped.
# - `make after` is the project Makefile rule that embeds bin/data and the
#   icon into the bundle (self-contained app — runs from /Applications).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-arm64:
    name: arm64 release build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Cache openFrameworks 0.12.1 (extracted tree incl. compiled core)
        id: ofcache
        uses: actions/cache@v4
        with:
          path: ~/lib/of_v0.12.1_osx_release
          key: of_v0.12.1_osx_release-arm64-v1

      - name: Install openFrameworks 0.12.1 (BUILD-arm64.md recipe)
        if: steps.ofcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/lib && cd ~/lib
          curl -fLO https://github.com/openframeworks/openFrameworks/releases/download/0.12.1/of_v0.12.1_osx_release.tar.gz
          tar xzf of_v0.12.1_osx_release.tar.gz
          rm of_v0.12.1_osx_release.tar.gz

      - name: Build (Release, all cores)
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Embed data + icon (self-contained app)
        run: make after

      - name: Zip the app bundle
        run: |
          cd bin
          # ditto is the macOS-blessed bundler: keeps the executable bit and
          # Finder metadata that unzip-on-another-Mac needs to just run.
          ditto -c -k --keepParent Starships.app "Starships-${GITHUB_REF_NAME}-arm64.zip"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Starships-${{ github.ref_name }}-arm64.zip
          body: |
            Native macOS arm64 build (openFrameworks 0.12.1) of the tagged
            version, built on a GitHub macOS arm64 runner with the
            BUILD-arm64.md make recipe. Data + icon are embedded — the app
            is self-contained.

            **Unsigned build:** on first launch macOS Gatekeeper will block
            it. Right-click → Open (once), or
            `xattr -dr com.apple.quarantine /Applications/Starships.app`.

            **Known limitation:** launched from a non-GUI context the window
            can size itself wrong (see BUILD-arm64.md) — open it from
            Finder/Terminal normally.
          fail_on_unmatched_files: true
