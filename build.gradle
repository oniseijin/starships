 plugins {
  id "org.openbakery.xcode-plugin" version "0.15.3"
}

xcodebuild {
    target = "Starships"
    target = "Release"
}

task deploy(){
    dependsOn "deployLocal"
    dependsOn "build"
}

task deployLocal(type: Copy, description: "copy to local Applications") {
    from 'bin'
    into '/Applications/Starships'
    include 'Starships.app/**'
    include 'data/*'
}