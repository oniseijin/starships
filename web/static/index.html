<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starships — web 1v1</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #game { display: block; margin: auto; image-rendering: auto; }
  #hud {
    position: fixed; top: 8px; left: 12px; color: #cfe; z-index: 2;
    font: 14px/1.45 ui-monospace, Menlo, monospace; text-shadow: 0 1px 2px #000;
    pointer-events: none; white-space: pre;
  }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 18px ui-monospace, Menlo, monospace; z-index: 3;
    background: rgba(0,0,0,0.55); text-align: center; white-space: pre; line-height: 1.8;
  }
  /* `m` lazer-color menu (C++ ofxPanel: top-left, aLazer + bLazer).
     Mouse/touch only; swallows no keyboard — the game keeps running. */
  #menu {
    position: fixed; top: 64px; left: 12px; z-index: 4;
    color: #cfe; font: 14px ui-monospace, Menlo, monospace;
    background: rgba(0,0,24,0.78); border: 1px solid #567; border-radius: 4px;
    padding: 8px 12px; user-select: none;
  }
  #menu .mtitle { margin-bottom: 6px; color: #fff; }
  #menu label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  #menu input[type="color"] {
    width: 46px; height: 24px; padding: 0; border: 1px solid #789;
    background: none; cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="menu" class="hidden">
  <div class="mtitle">menu</div>
  <label>aLazer <input type="color" id="colA" value="#7fe5ee"></label>
  <label>bLazer <input type="color" id="colB" value="#ffcccc"></label>
</div>
<div id="overlay">connecting…</div>
<canvas id="game" width="1500" height="900"></canvas>
<script src="/client.js"></script>
</body>
</html>
